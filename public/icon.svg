<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#pwaBg)" />

  <!-- Inner Soft Border -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4" />

  <!-- Caduceus / Medical Cross Emblem -->
  <g filter="url(#shadow)" transform="translate(256, 230)">
    <!-- Red/Coral Clinical Cross Symbol with soft white outline -->
    <path d="M-42,-110 H42 V-42 H110 V42 H42 V110 H-42 V42 H-110 V-42 H-42 Z" fill="#ffffff" rx="14" />
    <path d="M-36,-104 H36 V-36 H104 V36 H36 V104 H-36 V36 H-104 V-36 H-36 Z" fill="#0d9488" rx="10" />

    <!-- Stethoscope Inner Heart Emblem -->
    <path d="M0, -20 C-18,-45 -48,-30 -48,-6 C-48,22 0,56 0,56 C0,56 48,22 48,-6 C48,-30 18,-45 0,-20 Z" fill="#ffffff" />
    <path d="M0, -14 C-14,-36 -38,-24 -38,-4 C-38,18 0,46 0,46 C0,46 38,18 38,-4 C38,-24 14,-36 0,-14 Z" fill="#e11d48" />

    <!-- Nurse Cap Silhouette on Top -->
    <path d="M-68,-90 L68,-90 L52,-138 L-52,-138 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M-22,-114 H22 V-106 H-22 Z" fill="#e11d48"/>
  </g>

  <!-- Bottom Badge: PNLE 500 -->
  <g transform="translate(256, 420)">
    <rect x="-140" y="-30" width="280" height="56" rx="28" fill="#ffffff" />
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="26" fill="#0f766e" text-anchor="middle" letter-spacing="1.5">
      PNLE · 500 TOS
    </text>
  </g>
</svg>
